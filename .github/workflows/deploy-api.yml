name: Deploy API

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    environment: main
    env:
      DEPLOY_DIR_NAME: api-todofairyV2
      DEPLOY_ARCHIVE: deploy-bundle.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify deploy start
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.FEISHU_ROBOT_WEBHOOK }}
          TITLE: 任务精灵：开始部署
          COLOR: blue
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook = os.environ.get("WEBHOOK", "").strip()
          if not webhook:
              print("::warning::未配置 FEISHU_ROBOT_WEBHOOK，飞书通知未发送。")
              sys.exit(1)

          content = (
              f"提交：{os.environ['SHA'][:7]}\n"
              f"触发人：{os.environ['ACTOR']}\n"
              f"详情：{os.environ['RUN_URL']}"
          )
          payload = {
              "msg_type": "interactive",
              "card": {
                  "schema": "2.0",
                  "header": {
                      "title": {"tag": "plain_text", "content": os.environ["TITLE"]},
                      "template": os.environ["COLOR"],
                  },
                  "body": {
                      "elements": [
                          {"tag": "markdown", "content": content},
                          {
                              "tag": "button",
                              "text": {"tag": "plain_text", "content": "查看部署详情"},
                              "type": "default",
                              "behaviors": [{"type": "open_url", "default_url": os.environ["RUN_URL"]}],
                          },
                      ],
                  },
              },
          }
          try:
              request = urllib.request.Request(
                  webhook,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              code = result.get("code", result.get("StatusCode")) if isinstance(result, dict) else None
              if type(code) is not int or code != 0:
                  print(f"::warning::飞书未确认接收通知，返回码：{code if type(code) is int else '未知'}。")
                  sys.exit(1)
          except Exception as error:
              print(f"::warning::飞书通知发送失败（{type(error).__name__}），请检查机器人配置和网络。")
              sys.exit(1)
          print("飞书已成功接收通知。")
          PY

      - name: Create deploy bundle
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=apps/miniprogram \
            --exclude=data \
            --exclude=coverage \
            --exclude="$DEPLOY_ARCHIVE" \
            -czf "$DEPLOY_ARCHIVE" . || [ "$?" -eq 1 ]

      - name: Upload deploy bundle
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          KEY_FILE=$(mktemp)
          echo "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          scp -i "$KEY_FILE" -P "$PORT" -o StrictHostKeyChecking=no \
            "$DEPLOY_ARCHIVE" "$USER@$HOST:~/"
          rm -f "$KEY_FILE"

      - name: Cleanup stale build processes on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker compose -f ~/api-todofairyV2/docker-compose.deploy.yml stop api 2>/dev/null || true
            docker builder prune --filter until=168h -f 2>/dev/null || true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_DIR_NAME: ${{ env.DEPLOY_DIR_NAME }}
          DEPLOY_ARCHIVE: ${{ env.DEPLOY_ARCHIVE }}
          SECRET_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          SECRET_WECHAT_APPID: ${{ secrets.PROD_WECHAT_APPID }}
          SECRET_WECHAT_SECRET: ${{ secrets.PROD_WECHAT_SECRET }}
          SECRET_INTERNAL_API_KEY: ${{ secrets.PROD_INTERNAL_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR_NAME,DEPLOY_ARCHIVE,SECRET_DATABASE_URL,SECRET_JWT_SECRET,SECRET_WECHAT_APPID,SECRET_WECHAT_SECRET,SECRET_INTERNAL_API_KEY
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            DEPLOY_DIR="$HOME/$DEPLOY_DIR_NAME"
            mkdir -p "$DEPLOY_DIR"

            tar -xzf "$HOME/$DEPLOY_ARCHIVE" -C "$DEPLOY_DIR"
            rm -f "$HOME/$DEPLOY_ARCHIVE"

            cd "$DEPLOY_DIR"

            cat > .env.production <<EOF
            PORT=3000
            NODE_ENV=production
            JWT_EXPIRES_IN=7d
            DATABASE_URL=${SECRET_DATABASE_URL}
            JWT_SECRET=${SECRET_JWT_SECRET}
            WECHAT_APPID=${SECRET_WECHAT_APPID}
            WECHAT_SECRET=${SECRET_WECHAT_SECRET}
            INTERNAL_API_KEY=${SECRET_INTERNAL_API_KEY}
            EOF

            docker compose -f docker-compose.deploy.yml build --pull
            docker compose -f docker-compose.deploy.yml run --rm api pnpm --filter @todo-fairy/api prisma:migrate:deploy
            docker compose -f docker-compose.deploy.yml up -d api
            docker image prune -f

      - name: Sync nginx config
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_DIR_NAME: ${{ env.DEPLOY_DIR_NAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR_NAME
          script: |
            CERT="/etc/letsencrypt/live/api-task.aitrealmaker.top/fullchain.pem"
            CONF_SRC="$HOME/$DEPLOY_DIR_NAME/deploy/nginx/api-task.aitrealmaker.top.conf"
            CONF_DEST="/etc/nginx/sites-available/api-task.aitrealmaker.top"
            if [ -f "$CERT" ] && [ -f "$CONF_SRC" ]; then
              cp "$CONF_SRC" "$CONF_DEST"
              nginx -t && nginx -s reload
            fi

      - name: Notify deploy success
        if: success()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.FEISHU_ROBOT_WEBHOOK }}
          TITLE: 任务精灵：部署成功
          COLOR: green
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook = os.environ.get("WEBHOOK", "").strip()
          if not webhook:
              print("::warning::未配置 FEISHU_ROBOT_WEBHOOK，飞书通知未发送。")
              sys.exit(1)

          content = (
              f"提交：{os.environ['SHA'][:7]}\n"
              f"触发人：{os.environ['ACTOR']}\n"
              f"详情：{os.environ['RUN_URL']}"
          )
          payload = {
              "msg_type": "interactive",
              "card": {
                  "schema": "2.0",
                  "header": {
                      "title": {"tag": "plain_text", "content": os.environ["TITLE"]},
                      "template": os.environ["COLOR"],
                  },
                  "body": {
                      "elements": [
                          {"tag": "markdown", "content": content},
                          {
                              "tag": "button",
                              "text": {"tag": "plain_text", "content": "查看部署详情"},
                              "type": "default",
                              "behaviors": [{"type": "open_url", "default_url": os.environ["RUN_URL"]}],
                          },
                      ],
                  },
              },
          }
          try:
              request = urllib.request.Request(
                  webhook,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              code = result.get("code", result.get("StatusCode")) if isinstance(result, dict) else None
              if type(code) is not int or code != 0:
                  print(f"::warning::飞书未确认接收通知，返回码：{code if type(code) is int else '未知'}。")
                  sys.exit(1)
          except Exception as error:
              print(f"::warning::飞书通知发送失败（{type(error).__name__}），请检查机器人配置和网络。")
              sys.exit(1)
          print("飞书已成功接收通知。")
          PY

      - name: Notify deploy failure
        if: failure()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.FEISHU_ROBOT_WEBHOOK }}
          TITLE: 任务精灵：部署失败
          COLOR: red
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook = os.environ.get("WEBHOOK", "").strip()
          if not webhook:
              print("::warning::未配置 FEISHU_ROBOT_WEBHOOK，飞书通知未发送。")
              sys.exit(1)

          content = (
              f"提交：{os.environ['SHA'][:7]}\n"
              f"触发人：{os.environ['ACTOR']}\n"
              f"详情：{os.environ['RUN_URL']}"
          )
          payload = {
              "msg_type": "interactive",
              "card": {
                  "schema": "2.0",
                  "header": {
                      "title": {"tag": "plain_text", "content": os.environ["TITLE"]},
                      "template": os.environ["COLOR"],
                  },
                  "body": {
                      "elements": [
                          {"tag": "markdown", "content": content},
                          {
                              "tag": "button",
                              "text": {"tag": "plain_text", "content": "查看部署详情"},
                              "type": "default",
                              "behaviors": [{"type": "open_url", "default_url": os.environ["RUN_URL"]}],
                          },
                      ],
                  },
              },
          }
          try:
              request = urllib.request.Request(
                  webhook,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              code = result.get("code", result.get("StatusCode")) if isinstance(result, dict) else None
              if type(code) is not int or code != 0:
                  print(f"::warning::飞书未确认接收通知，返回码：{code if type(code) is int else '未知'}。")
                  sys.exit(1)
          except Exception as error:
              print(f"::warning::飞书通知发送失败（{type(error).__name__}），请检查机器人配置和网络。")
              sys.exit(1)
          print("飞书已成功接收通知。")
          PY
