openapi: 3.0.3
info:
  title: 任务精灵 API
  version: 0.1.0
  description: 任务精灵独立 Node.js 后端接口契约
servers:
  - url: https://api.todo-fairy.local
tags:
  - name: Auth
  - name: Public
  - name: Tags
  - name: Tasks
  - name: Todos
  - name: Calendar
  - name: Notifications
  - name: AI
  - name: Internal
  - name: Stats
paths:
  /api/v1/health:
    get:
      tags: [Auth]
      summary: 健康检查
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/public/runtime:
    get:
      tags: [Public]
      summary: 查询运行时信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/auth/wechat-login:
    post:
      tags: [Auth]
      summary: 微信小程序登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                devOpenId:
                  type: string
                  description: 本地开发联调用 openid，生产环境不应传递
              required: [code]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/auth/profile:
    get:
      tags: [Auth]
      summary: 查询当前登录用户
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: 查询任务列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags: [Tasks]
      summary: 创建任务
      description: 开启子任务时，subTasks 每项包含 subTaskId（稳定标识）与 title（标题）；数组顺序即子任务展示顺序。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: 查询任务详情
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    put:
      tags: [Tasks]
      summary: 更新任务
      description: 调整 subTasks 数组顺序即可排序。subTaskId 必须随原子任务保留，系统据此保持已完成子待办的正确归属。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags: [Tasks]
      summary: 删除任务
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/tasks/{taskId}/stats:
    get:
      tags: [Tasks]
      summary: 查询任务统计
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/tags:
    get:
      tags: [Tags]
      summary: 查询标签列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags: [Tags]
      summary: 创建标签
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/tags/options:
    get:
      tags: [Tags]
      summary: 查询标签选项
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/tags/{tagId}:
    put:
      tags: [Tags]
      summary: 更新标签
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tagId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags: [Tags]
      summary: 删除标签
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tagId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/todos:
    get:
      tags: [Todos]
      summary: 查询待办列表
      description: 列表每项新增 isOneTime（布尔值，含子待办，来源于所属任务的空重复星期；缺失关联时为 false）。未完成的一次性待办保留在 list 中，但不计入 total、uncompletedCount 和完成率；完成后计入 total、completedCount。一次性待办不标记失效。状态修改及编辑待办的返回项也包含 isOneTime。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/todos/compensate-today:
    post:
      tags: [Todos]
      summary: 触发当日补偿
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/todos/{todoId}:
    patch:
      tags: [Todos]
      summary: 更新待办
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: todoId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags: [Todos]
      summary: 删除待办
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: todoId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/todos/{todoId}/status:
    patch:
      tags: [Todos]
      summary: 更新待办状态
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: todoId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/calendar/month:
    get:
      tags: [Calendar]
      summary: 查询月历状态
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            example: 2026-04
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/notifications/settings:
    get:
      tags: [Notifications]
      summary: 查询通知设置
      description: 仅返回飞书地址的配置状态和脱敏值、日报周报开关、发送时间及最近测试结果，不返回 SendKey、hasSendKey 或 sendKeyMasked。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    put:
      tags: [Notifications]
      summary: 保存通知设置
      description: 仅处理 dailyEnabled、weeklyEnabled、feishuWebhook。飞书地址省略时保留，空字符串表示清除；任一提醒开启时必须配置飞书地址。旧请求中的 sendKey 忽略，不修改数据库旧值。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/notifications/test-send:
    post:
      tags: [Notifications]
      summary: 测试日报发送
      description: 发送蓝色飞书日报卡片，标题“任务精灵：日报（测试）”。正文日期后依次独立成行显示任务数、已完成、未完成、完成率。测试日志使用独立通道，不影响正式通知。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/notifications/test-send-weekly:
    post:
      tags: [Notifications]
      summary: 测试周报发送
      description: 发送紫色飞书周报卡片，标题“任务精灵：周报（测试）”，展示上周日期范围和每行一项的四项统计。不受周一限制，只尝试一次；使用独立测试通道，不影响正式通知。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/notifications/preview-content:
    post:
      tags: [Notifications]
      summary: 预览通知文案
      description: 按现有统计规则返回 title、content、summary、generatedAt。正文日期及四项统计各占一行，不调用AI，不返回 aiUsed、aiFallbackReason、temporary、temporaryTag。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/ai/subtasks/split:
    post:
      tags: [AI]
      summary: AI拆解子任务
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/internal/daily-rollover:
    post:
      description: 北京时间每日凌晨1点执行。先将早于当天且未完成的一次性父待办及其全部有效子项移至当天，再处理重复任务的过期和生成；保留原记录及子项进度。新增返回 oneTimeDeferred（顺延父待办数量），重复执行不重复顺延；失败重跑时积压记录直接移至当天。已有记录同样适用。
      tags: [Internal]
      summary: 每日日切
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/internal/daily-summary-notify:
    post:
      tags: [Internal]
      summary: 每日日报通知
      description: 后台每天北京时间22点自动执行同一发送逻辑。飞书为蓝色卡片，标题“任务精灵：日报”，日期及四项统计各占一行。已成功的正式通知跳过，历史测试记录不阻断正式发送。返回发送成功、失败与跳过数。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/internal/weekly-summary-notify:
    post:
      tags: [Internal]
      summary: 每周周报通知
      description: 后台每周一北京时间9点自动执行同一发送逻辑，非周一跳过。汇总上周周一至周日，飞书为紫色卡片，标题“任务精灵：周报”，日期范围及四项统计各占一行。失败同次最多尝试3次，测试记录不影响正式发送。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/internal/db-init:
    post:
      tags: [Internal]
      summary: 初始化存储
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/stats/overview:
    get:
      tags: [Stats]
      summary: 获取统计概览
      description: 返回今日、本周、本月的待办完成率，以及按标签分组的本月完成情况
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/stats/trend:
    get:
      tags: [Stats]
      summary: 获取近30天趋势
      description: 返回过去30天每天的待办总数、完成数和完成率
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/stats/streak:
    get:
      tags: [Stats]
      summary: 获取打卡连续天数
      description: 返回当前连续打卡天数和历史最长连续打卡天数（当天有待办且全部完成才算打卡成功）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          type: object
        traceId:
          type: string
      required: [code, message, data, traceId]
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: integer
          example: 10001
        message:
          type: string
          example: VALIDATION_ERROR
        details:
          type: object
        traceId:
          type: string
      required: [code, message, traceId]
